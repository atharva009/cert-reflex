spring:
  application:
    name: cert-reflex
  # scripts/create-ca-key.sh writes CA_KEY_ID into a gitignored .env at the repo
  # root; loading it as a property source means no manual export is needed.
  # A real exported CA_KEY_ID environment variable still wins over this file.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/pki
    username: pki
    password: pki
  flyway:
    enabled: true
    locations: classpath:db/migration
  ssl:
    bundle:
      watch:
        file:
          # 10s by default, which is a third of the rotate threshold. See
          # locked decision 12.
          quiet-period: 1s
      pem:
        # These paths must match the matching pki.services entry; startup
        # fails if they drift. See the report for why they are not unified.
        demo-a:
          reload-on-update: true
          keystore:
            certificate: file:./runtime/demo-a/cert.pem
            private-key: file:./runtime/demo-a/key.pem
        demo-b:
          reload-on-update: true
          keystore:
            certificate: file:./runtime/demo-b/cert.pem
            private-key: file:./runtime/demo-b/key.pem
        demo-c:
          reload-on-update: true
          keystore:
            certificate: file:./runtime/demo-c/cert.pem
            private-key: file:./runtime/demo-c/key.pem

server:
  port: 8080

aws:
  kms:
    endpoint: http://localhost:4566
    region: us-east-1
    ca-key-id: ${CA_KEY_ID:}

pki:
  cert-validity: PT2M
  rotate-threshold: PT30S
  watcher-interval: PT5S
  # Every cert, key and CA file must resolve inside this root; startup fails otherwise.
  runtime-root: ./runtime
  ca-path: ./runtime/ca.pem
  # The single definition of the managed fleet: bootstrap, the demo listeners,
  # the watcher and the remediator all read this list.
  services:
    - name: demo-a
      common-name: demo-a
      port: 8443
      cert-path: ./runtime/demo-a/cert.pem
      key-path: ./runtime/demo-a/key.pem
    - name: demo-b
      common-name: demo-b
      port: 8444
      cert-path: ./runtime/demo-b/cert.pem
      key-path: ./runtime/demo-b/key.pem
    - name: demo-c
      common-name: demo-c
      port: 8445
      cert-path: ./runtime/demo-c/cert.pem
      key-path: ./runtime/demo-c/key.pem
