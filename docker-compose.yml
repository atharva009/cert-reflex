services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pki
      POSTGRES_USER: pki
      POSTGRES_PASSWORD: pki
    ports:
      # Host port is overridable so a machine with its own Postgres on 5432
      # can still run the stack; reviewers get 5432 by default.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pki -d pki"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  localstack:
    # Pinned to the 4.x line: from the 2025/2026 CalVer releases onward the
    # `latest` image is the Pro build and exits 55 without a license token.
    image: localstack/localstack:4.14
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kms
    healthcheck:
      test: ["CMD-SHELL", "awslocal kms list-keys > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s
